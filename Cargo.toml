[package]
name = "yrepo"
description = "LSP-friendly YANG repository: parse, resolve and query YANG modules"
version = "0.6.0"
authors = ["trislu <lukai@mail.ustc.edu.cn>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/trislu/yrepo"
homepage = "https://github.com/trislu/yrepo"
keywords = ["yang", "lsp", "schema", "parser", "netconf"]
categories = ["parser-implementations", "development-tools"]
exclude = ["docs/", "examples/", "tests/"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "yrepo"

[dependencies]
tree-sitter = "0.26"
tree-sitter-yang = "0.4.1"
rayon = { version = "1.10", optional = true }

[features]
default = []
# Parallel parsing/compilation (bulk file ingest via
# `Repository::upsert_many_files` and the per-module phases of `compile`). Off
# by default to keep the dependency tree lean; consumers who open/compile many
# documents at once can enable it.
parallel = ["dep:rayon"]

# Release tools and benchmarks use the same optimization profile as the
# language server (LTO + single codegen unit + stripped), so example timings
# (perf/serveperf/catmem/…) are representative of served builds.
[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = 3
